name: Build and Export ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build the game
        run: npm run build

      - name: Create ZIP file
        run: |
          cd dist
          zip -r ../BlockOps-Game.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Game Build (HTML5 ZIP)"
          body: "Download the attached BlockOps-Game.zip file. Extract it and upload to any Game Distribution platform or host it on a local server."
          files: BlockOps-Game.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
