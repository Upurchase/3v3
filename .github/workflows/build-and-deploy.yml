name: Build and Export HTML5

on:
  push:
    branches: [ "main", "master" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build the game
        run: npm run build

      # Provides a downloadable ZIP file in GitHub Actions tab for manual upload (like Itch.io)
      - name: Upload Build Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: HTML5-Game-Build
          path: dist/

      # Prepares the files for GitHub Pages deployment
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
